<div class="chat-root w-100">
  <!-- Initial state: input at top -->
  <div class="content-container w-90" *ngIf="!hasConversation">
    <div class="prompt-input-container mt-2">
      <input
        class="prompt-input"
        type="text"
        [placeholder]="placeholder"
        #promptInput
        (input)="onInputChange($event)"
        (keydown.enter)="onSend()"
      />
      <button class="send-button" type="button" aria-label="Send" (click)="onSend()">
        <i class="bi bi-send-fill"></i>
      </button>
    </div>
    <div class="chat-actions mt-2">
      <div class="chat-actions-left">
        <button class="icon-button" type="button" aria-label="View/Edit Context" ngbTooltip="View/Edit Context" placement="bottom" (click)="openContextModal()">
          <i class="bi bi-braces"></i>
        </button>
        <button class="icon-button" type="button" aria-label="Attach files" ngbTooltip="Attach files" placement="bottom" (click)="fileInput.click()">
          <i class="bi bi-paperclip"></i>
        </button>
        <button class="icon-button" type="button" aria-label="Voice input" ngbTooltip="Voice input" placement="bottom" (click)="onVoiceInputToggle()">
          <i class="bi bi-mic"></i>
        </button>
        <button class="icon-button" type="button" aria-label="Regenerate last reply" ngbTooltip="Regenerate last reply" placement="bottom" (click)="onRegenerate()">
          <i class="bi bi-arrow-repeat"></i>
        </button>
        <button class="icon-button" type="button" aria-label="Stop" ngbTooltip="Stop" placement="bottom" (click)="onStop()">
          <i class="bi bi-stop-circle"></i>
        </button>
        <button class="icon-button" type="button" aria-label="Clear conversation" ngbTooltip="Clear conversation" placement="bottom" (click)="onClear()">
          <i class="bi bi-eraser"></i>
        </button>
        <input type="file" #fileInput multiple (change)="onFilesSelected($event)" style="display:none" />
      </div>
      <div class="chat-actions-right">
        <app-prompt-analyser [text]="currentPrompt"></app-prompt-analyser>
      </div>
    </div>
  </div>

  <!-- Conversation: messages at top -->
  <div class="messages-container w-90 mb-4 pb-4" *ngIf="hasConversation" #messagesContainer>
    @for (m of messages; track $index) {
      <div class="message-row" [class.from-user]="m.role === 'user'" [class.from-assistant]="m.role === 'assistant'">
        <div class="message-bubble">{{ m.text }}</div>
      </div>
    }
  </div>

  <!-- Composer at bottom once conversation starts -->
  <div class="content-container w-90" [class.composer]="hasConversation" *ngIf="hasConversation">
    <div class="prompt-input-container mt-2 mb-4">
      <input
        class="prompt-input"
        type="text"
        [placeholder]="placeholder"
        #promptInput
        (input)="onInputChange($event)"
        (keydown.enter)="onSend()"
      />
      <button class="send-button" type="button" aria-label="Send" (click)="onSend()">
        <i class="bi bi-send-fill"></i>
      </button>
    </div>
    <div class="chat-actions mb-2">
      <div class="chat-actions-left">
        <button class="icon-button" type="button" aria-label="View/Edit Context" ngbTooltip="View/Edit Context" placement="bottom" (click)="openContextModal()">
          <i class="bi bi-braces"></i>
        </button>
        <button class="icon-button" type="button" aria-label="Attach files" ngbTooltip="Attach files" placement="bottom" (click)="fileInput2.click()">
          <i class="bi bi-paperclip"></i>
        </button>
        <button class="icon-button" type="button" aria-label="Voice input" ngbTooltip="Voice input" placement="bottom" (click)="onVoiceInputToggle()">
          <i class="bi bi-mic"></i>
        </button>
        <button class="icon-button" type="button" aria-label="Regenerate last reply" ngbTooltip="Regenerate last reply" placement="bottom" (click)="onRegenerate()">
          <i class="bi bi-arrow-repeat"></i>
        </button>
        <button class="icon-button" type="button" aria-label="Stop" ngbTooltip="Stop" placement="bottom" (click)="onStop()">
          <i class="bi bi-stop-circle"></i>
        </button>
        <button class="icon-button" type="button" aria-label="Clear conversation" ngbTooltip="Clear conversation" placement="bottom" (click)="onClear()">
          <i class="bi bi-eraser"></i>
        </button>
        <input type="file" #fileInput2 multiple (change)="onFilesSelected($event)" style="display:none" />
      </div>
      <div class="chat-actions-right">
        <app-prompt-analyser [text]="currentPrompt"></app-prompt-analyser>
      </div>
    </div>
  </div>

  <!-- Suggestions only before conversation starts -->
  <div class="suggestions-container" *ngIf="!hasConversation">
    @for (suggestion of suggestions; track suggestion.prompt) {
      <div class="suggestion-item small" (click)="onSuggestionClick(suggestion)">
        <i class="bi" [class]="suggestion.icon"></i>
        <span>{{ suggestion.prompt }}</span>
      </div>
    }
  </div>
</div>
