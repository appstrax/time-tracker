<div class="d-flex flex-column align-items-center justify-content-center full-height w-100">
  <div class="content-container w-75">
    <div class="d-flex flex-column align-items-start">
      <h1>{{ title }}</h1>
      <h3>{{ subtitle }}</h3>
    </div>

    <div class="d-flex mt-5 prompt-input-container">
      <input
        class="prompt-input"
        type="text"
        placeholder="What is your command master?"
        #promptInput
      />

      <div class="send-button d-flex align-items-center justify-content-center">
        <i class="bi bi-send-fill text-white"></i>
      </div>
    </div>
  </div>

  <div class="suggestions-container">
    @for (suggestion of suggestions; track suggestion.prompt) {
      <div class="suggestion-item small" (click)="onSuggestionClick(suggestion)">
        <i class="bi" [class]="suggestion.icon"></i>
        <span>{{ suggestion.prompt }}</span>
      </div>
    }
  </div>
</div>
