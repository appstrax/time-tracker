<div
  class="project-dropdown form-group"
  [class.show]="isProjectDropdownOpen"
  [class.project-dropdown--compact]="compact"
>
    <button
      type="button"
      class="btn btn-outline-dark dropdown-toggle w-100 d-flex align-items-center justify-content-between"
      [class.form-select]="!compact"
      (click)="toggleProjectDropdown()"
      [disabled]="disabled"
      aria-expanded="isProjectMenuOpen"
    >
      <span class="project-dropdown-selection d-flex align-items-center gap-2">
        @if (selectedProject) { @if (selectedProject.logoUrl) {
        <img
          [src]="selectedProject.logoUrl"
          alt="logo"
          class="proj-thumb"
          loading="lazy"
        />
        } @else {
        <i class="bi bi-image proj-thumb-fallback"></i>
        }
        <span
          class="project-dropdown-name"
          [attr.title]="selectedProject.name"
          >{{ selectedProject.name }}</span>
        } @else {
        <i class="bi bi-image proj-thumb-fallback"></i>
        <span class="project-dropdown-name">Select a project</span>
        }
      </span>
      <i
        class="bi project-dropdown-chevron flex-shrink-0"
        [ngClass]="isProjectDropdownOpen ? 'bi-chevron-up' : 'bi-chevron-down'"
      ></i>
    </button>
    <ul
      class="dropdown-menu dropdown-menu-end w-100"
      [class.show]="isProjectDropdownOpen && !disabled"
      [attr.data-bs-popper]="isProjectDropdownOpen && !disabled ? 'static' : null"
    >
      @if (allowNull) {
      <li>
        <button
          class="dropdown-item d-flex align-items-center gap-2"
          type="button"
          (click)="onProjectSelected(null)"
          [class.active]="selectedProject === null || selectedProject === undefined"
          [disabled]="disabled"
        >
          <i class="bi bi-image proj-thumb-fallback"></i>
          <span>Select a project</span>
        </button>
      </li>
      }
      @for (project of projects(); track project.id) {
      <li>
        <button
          class="dropdown-item d-flex align-items-center gap-2"
          type="button"
          (click)="onProjectSelected(project)"
          [class.active]="selectedProject?.id === project.id"
          [disabled]="disabled"
        >
          @if (project.logoUrl) {
          <img
            [src]="project.logoUrl"
            alt="logo"
            class="proj-thumb"
            loading="lazy"
          />
          } @else {
          <i class="bi bi-image proj-thumb-fallback"></i>
          }
          <span>{{ project.name }}</span>
        </button>
      </li>
      }
    </ul>
  </div>
