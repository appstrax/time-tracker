<div class="collapsed-nav">
  <div class="logo-section">
    <a routerLink="/home">
      <img
        src="/time-tracker-logo.svg"
        alt="Time Tracker Logo"
        class="site-logo"
      />
    </a>
  </div>

  <div class="nav-items">
    <a
      routerLink="/home"
      routerLinkActive="active"
      class="nav-item"
      data-bs-toggle="tooltip"
      data-bs-title="Home"
      data-bs-placement="right"
    >
      <div class="icon-box">
        <i class="bi bi-house-door-fill"></i>
      </div>
    </a>
    <a
      routerLink="/time-sheet"
      routerLinkActive="active"
      class="nav-item"
      data-bs-toggle="tooltip"
      data-bs-title="Time Sheets"
      data-bs-placement="right"
    >
      <div class="icon-box">
        <i class="bi bi-stopwatch-fill"></i>
      </div>
    </a>
    @if (admin()) {
      <a
        routerLink="/analytics"
        routerLinkActive="active"
        class="nav-item"
        data-bs-toggle="tooltip"
        data-bs-title="Analytics"
        data-bs-placement="right"
      >
        <div class="icon-box">
          <i class="bi bi-bar-chart-fill"></i>
        </div>
      </a>

      <a
        routerLink="/projects"
        routerLinkActive="active"
        class="nav-item"
        data-bs-toggle="tooltip"
        data-bs-title="Projects"
        data-bs-placement="right"
      >
        <div class="icon-box">
          <i class="bi bi-folder-fill"></i>
        </div>
      </a>
    }
  </div>

  <div class="profile-section">
    <a
      routerLink="/settings"
      routerLinkActive="active"
      class="nav-item"
      data-bs-toggle="tooltip"
      data-bs-title="Settings"
      data-bs-placement="right"
    >
      <div class="icon-box">
        <i class="bi bi-gear-fill"></i>
      </div>
    </a>
    <a
      routerLink="/profile"
      routerLinkActive="active"
      class="nav-item"
      data-bs-toggle="tooltip"
      [attr.data-bs-title]="profileAriaLabel()"
      [attr.aria-label]="profileAriaLabel()"
      data-bs-placement="right"
    >
      <div class="icon-box avatar-box">
        <app-user-avatar [user]="user()" [sizePx]="35" [fontSizePx]="13" />
      </div>
    </a>
    <div
      class="nav-item"
      data-bs-toggle="tooltip"
      data-bs-title="Logout"
      data-bs-placement="right"
      (click)="logout.emit()"
    >
      <div class="icon-box">
        <i class="bi bi-power"></i>
      </div>
    </div>
  </div>

  <button
    class="toggle-btn"
    type="button"
    (click)="toggle.emit()"
    aria-label="Expand side navigation"
  >
    <i class="bi bi-chevron-double-right"></i>
  </button>
</div>
