<div class="expanded-nav">
  <div class="logo-row">
    <a routerLink="/home" class="brand">
      <img src="/machine-logo.png" alt="Machine Logo" class="site-logo">
      <span class="brand-name">Machine</span>
    </a>
    <button class="toggle-btn" type="button" (click)="toggle.emit()" aria-label="Collapse side navigation">
      <i class="bi bi-chevron-double-left"></i>
    </button>
  </div>

  <div class="menu">
    <div class="group pt-2" *ngFor="let group of groups">
      <button type="button" class="menu-item group-header" [class.active-group]="isGroupActive(group) && !expandedState[group.key]" (click)="toggleGroup(group.key)">
        <span class="label">{{ group.title }}</span>
        <i class="bi bi-chevron-right" [class.rotate]="expandedState[group.key]"></i>
      </button>
      <div class="group-items" *ngIf="expandedState[group.key]">
        <a [routerLink]="item.route" routerLinkActive="active" class="menu-item" *ngFor="let item of group.items">
          <i [class]="item.icon"></i>
          <span class="label">{{ item.title }}</span>
        </a>
      </div>
    </div>
  </div>

  <div class="footer">
    <a routerLink="/contact" routerLinkActive="active" class="menu-item">
      <i class="bi bi-envelope"></i>
      <span class="label">Contact</span>
    </a>
    <a routerLink="/settings" routerLinkActive="active" class="menu-item">
      <i class="bi bi-gear"></i>
      <span class="label">Settings</span>
    </a>
    <a routerLink="/profile" routerLinkActive="active" class="menu-item">
      <i class="bi bi-person-circle"></i>
      <span class="label">Profile</span>
    </a>
    <button class="menu-item" type="button" (click)="logout.emit()">
      <i class="bi bi-box-arrow-right"></i>
      <span class="label">Logout</span>
    </button>
  </div>
</div>
