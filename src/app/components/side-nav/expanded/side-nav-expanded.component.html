<div class="expanded-nav">
  <div class="logo-row">
    <a routerLink="/home" class="brand">
      <img
        src="/time-tracker-logo.svg"
        alt="Time Tracker Logo"
        class="site-logo"
      />
      <span class="brand-name">Time Tracker</span>
    </a>
    <button
      class="toggle-btn"
      type="button"
      (click)="toggle.emit()"
      aria-label="Collapse side navigation"
    >
      <i class="bi bi-chevron-double-left"></i>
    </button>
  </div>

  <div class="menu">
    <a routerLink="/home" routerLinkActive="active" class="menu-item">
      <i class="bi bi-house-door"></i>
      <span class="label">Home</span>
    </a>
    <a routerLink="/time-sheet" routerLinkActive="active" class="menu-item">
      <i class="bi bi-stopwatch"></i>
      <span class="label">Time Sheets</span>
    </a>
    @if (admin()) {
      <a routerLink="/analytics" routerLinkActive="active" class="menu-item">
        <i class="bi bi-graph-up"></i>
        <span class="label">Analytics</span>
      </a>

      <a routerLink="/projects" routerLinkActive="active" class="menu-item">
        <i class="bi bi-folder2-open"></i>
        <span class="label">Projects</span>
      </a>
    }
  </div>

  <div class="footer">
    <a routerLink="/settings" routerLinkActive="active" class="menu-item">
      <i class="bi bi-gear"></i>
      <span class="label">Settings</span>
    </a>
    <a routerLink="/profile" routerLinkActive="active" class="menu-item">
      <i class="bi bi-person-circle"></i>
      <span class="label">Profile</span>
    </a>
    <button class="menu-item" type="button" (click)="logout.emit()">
      <i class="bi bi-box-arrow-right"></i>
      <span class="label">Logout</span>
    </button>
  </div>
</div>
