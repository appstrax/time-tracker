<div
  class="side-nav"
  [class.visible]="isVisible"
  [class.expanded]="mode === 'expanded'"
  [class.collapsed]="mode === 'collapsed'"
>
  @if (mode === "collapsed") {
    <app-side-nav-collapsed (logout)="logout()" (toggle)="toggleNav()" />
  } @else {
    <app-side-nav-expanded (logout)="logout()" (toggle)="toggleNav()" />
  }
</div>
