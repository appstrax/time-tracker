<div class="modal-header bg-primary text-white align-items-center d-flex justify-content-between">
  <h4 class="modal-title mb-0">Change Password</h4>
  <button
    type="button"
    class="btn-close btn-close-white"
    aria-label="Close"
    (click)="close()"
  ></button>
</div>

<div class="modal-body">
  <form (ngSubmit)="submit()" #form="ngForm" autocomplete="off">
    <div class="form-group mb-3">
      <label for="currentPassword" class="form-label">Current Password</label>
      <input
        type="password"
        class="form-control"
        id="currentPassword"
        name="currentPassword"
        [ngModel]="currentPassword()"
        (ngModelChange)="currentPassword.set($event)"
        required
      />
    </div>
    <div class="form-group mb-3">
      <label for="newPassword" class="form-label">New Password</label>
      <input
        type="password"
        class="form-control"
        id="newPassword"
        name="newPassword"
        [ngModel]="newPassword()"
        (ngModelChange)="newPassword.set($event)"
        required
      />
    </div>
    <div class="form-group">
      <label for="confirmPassword" class="form-label">Confirm New Password</label>
      <input
        type="password"
        class="form-control"
        id="confirmPassword"
        name="confirmPassword"
        [ngModel]="confirmPassword()"
        (ngModelChange)="confirmPassword.set($event)"
        required
      />
    </div>

    @if (error()) {
      <div class="alert alert-danger mt-3 mb-0">
        {{ error() }}
      </div>
    }
  </form>
</div>

<div class="modal-footer d-flex justify-content-end">
  <button type="button" class="btn btn-outline-secondary" (click)="close()">
    Cancel
  </button>
  <button
    type="button"
    class="btn btn-primary d-inline-flex align-items-center gap-2"
    [disabled]="!isFormValid() || saving()"
    (click)="submit()"
  >
    @if (!saving()) { Save } @else {
      <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
      <span>Saving...</span>
    }
  </button>
</div>
