<section class="analytics-page insights-page">
  <div class="insights-shell">
    <header class="insights-hero">
      <div class="insights-hero-copy">
        <h1>Analytics</h1>
        <p class="insights-lead">
          Hours, approvals, and activity across your workspace.
        </p>
      </div>

      <div class="hero-actions">
        @if (!loading() && container(); as c) {
          <div class="view-type-segmented" role="tablist" aria-label="Time entry view">
            @for (viewType of c.visibleViewTypes(); track viewType.value) {
              <button
                type="button"
                role="tab"
                class="view-segment"
                [class.active]="c.activeView() === viewType.value"
                [attr.aria-selected]="c.activeView() === viewType.value"
                (click)="c.onViewTypeChange(viewType.value)"
              >
                {{ viewType.label }}
              </button>
            }
          </div>
          <button type="button" class="export-button" (click)="c.exportAllProjects()">
            <i class="bi bi-download" aria-hidden="true"></i>
            Export
          </button>
        }
      </div>
    </header>

    @if (loading()) {
      <section class="insights-state" aria-busy="true">
        <p>Loading analytics data…</p>
      </section>
    } @else {
      <app-filter-view-container
        [projects]="projects()"
        [entries]="entries()"
        [users]="users()"
        [showExport]="true"
        [showInsights]="true"
        [compact]="true"
        [canManageStatus]="true"
        [canApprove]="true"
        [showToolbar]="false"
        (entryUpdated)="onEntryUpdated($event)"
      >
        <app-summary-metrics
          kpis
          [entries]="entries()"
          [projects]="projects()"
          [compact]="true"
        />
      </app-filter-view-container>
    }
  </div>
</section>
