<div class="filter-view-container">
  <!-- View Selection Section -->
  <div class="card mb-3">
    <div class="card-header d-flex align-items-center justify-content-between">
      <span class="fw-semibold">Filter</span>
      <button
        type="button"
        class="btn btn-sm btn-link text-decoration-none p-0"
        (click)="toggleViewSelection()"
        [attr.aria-expanded]="!isViewSelectionCollapsed"
        aria-controls="viewSelectionCollapse"
      >
        <i
          [class]="
            'bi ' +
            (isViewSelectionCollapsed ? 'bi-chevron-down' : 'bi-chevron-up')
          "
        ></i>
      </button>
    </div>
    <div
      id="viewSelectionCollapse"
      [class.collapse]="true"
      [class.show]="!isViewSelectionCollapsed"
    >
      <div class="card-body">
        <div class="d-flex flex-wrap gap-2">
          @for (viewType of viewTypes; track viewType.value) {
          <button
            type="button"
            class="view-type-option btn"
            [class.active]="currentViewType === viewType.value"
            (click)="onViewTypeChange(viewType.value)"
          >
            <div class="icon-wrapper">
              <i [class]="'bi ' + viewType.icon"></i>
            </div>
            <div class="text-start">
              <div class="view-label">{{ viewType.label }}</div>
              <div class="view-description">{{ viewType.description }}</div>
            </div>
          </button>
          }
        </div>
      </div>

      <div class="d-flex flex-wrap gap-2 card-body">


        <app-filter-block label="Status">
          <select
            class="form-select form-select-sm"
            [(ngModel)]="filters.status"
            (change)="onEmitFilterChange()"
          >
            <option value="all">All</option>
            <option value="approved">Approved</option>
            <option value="pending">Pending</option>
          </select>
        </app-filter-block>

        <app-filter-block label="Category">
          <select
            class="form-select form-select-sm"
            [(ngModel)]="filters.category"
            (change)="onEmitFilterChange()"
          >
            <option [value]="''">All Categories</option>
            @for (category of categories; track category) {
            <option [value]="category">
              {{ category }}
            </option>
            }
          </select>
        </app-filter-block>

        <app-filter-block label="User">
          <select
            class="form-select form-select-sm"
            [(ngModel)]="filters.userId"
            (change)="onEmitFilterChange()"
          >
            <option [value]="''">All Users</option>
            @for (user of users; track user.id) {
            <option [value]="user.id">
              {{ user.name }}
            </option>
            }
          </select>
        </app-filter-block>

        <app-filter-block label="Date Range">
          <select
            class="form-select form-select-sm"
            [(ngModel)]="filters.dateRange"
            (change)="onDateRangeChange()"
          >
            <option value="week">This Week</option>
            <option value="month">This Month</option>
            <option value="year">This Year</option>
            <option value="all">All</option>
            <option value="custom">Custom</option>
          </select>

          @if (filters.dateRange === 'custom') {
          <div class="custom-date-range mt-2">
            <div class="custom-date-field">
              <label class="form-label small fw-semibold mb-1">Start</label>
              <input
                type="date"
                class="form-control form-control-sm"
                [ngModel]="toDateInput(filters.startDate)"
                (ngModelChange)="onCustomStartDateChange($event)"
              />
            </div>
            <div class="custom-date-field">
              <label class="form-label small fw-semibold mb-1">End</label>
              <input
                type="date"
                class="form-control form-control-sm"
                [ngModel]="toDateInput(filters.endDate)"
                (ngModelChange)="onCustomEndDateChange($event)"
              />
            </div>
          </div>
          }
        </app-filter-block>
      </div>
    </div>
  </div>

  <!-- View Content -->
  <div class="view-content">
    @if(currentViewType === 'summary') {
    <app-filter-view-summary
      [entries]="getEntriesForView()"
    ></app-filter-view-summary>
    } @else if(currentViewType === 'details') {
    <app-filter-view-details
      [entries]="getEntriesForView()"
    ></app-filter-view-details>
    } @else if(currentViewType === 'timeline') {
    <app-filter-view-timeline
      [entries]="getEntriesForView()"
    ></app-filter-view-timeline>
    } @else if(currentViewType === 'unapproved') {
    <app-unapproved-entries
      [timeSheetEntries]="timeSheetEntries"
      [canApprove]="canApprove"
    ></app-unapproved-entries>
    }
  </div>
</div>
