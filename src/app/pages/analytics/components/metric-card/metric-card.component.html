<article class="metric-card">
  <div class="metric-copy">
    <p class="metric-label">{{ label() }}</p>
    <div class="metric-value">
      {{ value() }}
      @if (valueSuffix()) {
        <span class="value-suffix">{{ valueSuffix() }}</span>
      }
    </div>
  </div>

  <div class="metric-icon" aria-hidden="true">
    <i [ngClass]="iconClass()"></i>
  </div>
</article>
