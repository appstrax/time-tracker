<div class="signup-page-container">
  <div class="signup-container">
    <div class="signup-content">
      <div class="left-panel">
        <h1 class="main-title">Sign up</h1>
        <p class="subtitle">to get started</p>
      </div>

      <div class="right-panel">
        <h2 class="welcome-text">Welcome!</h2>
        <p class="signup-instruction">Create your account</p>

        <form (ngSubmit)="register()" #form="ngForm" autocomplete="off">
          <div class="form-group">
            <label for="name" class="visually-hidden">First name</label>
            <div class="input-with-icon">
              <i class="bi bi-person"></i>
              <input
                type="text"
                class="form-control"
                id="name"
                name="name"
                [(ngModel)]="user.name"
                placeholder="First name"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="surname" class="visually-hidden">Last name</label>
            <div class="input-with-icon">
              <i class="bi bi-person"></i>
              <input
                type="text"
                class="form-control"
                id="surname"
                name="surname"
                [(ngModel)]="user.surname"
                placeholder="Last name"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="email" class="visually-hidden">Email</label>
            <div class="input-with-icon">
              <i class="bi bi-envelope"></i>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                [(ngModel)]="user.email"
                placeholder="Email address"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="password" class="visually-hidden">Password</label>
            <div class="input-with-icon">
              <i class="bi bi-lock"></i>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                [(ngModel)]="user.password"
                placeholder="Password"
                required
              />
            </div>
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger mb-3">
            {{ errorMessage }}
          </div>

          <button
            class="btn btn-primary signup-btn"
            type="submit"
            [disabled]="!isFormValid()"
            [ngClass]="{ 'disabled': isLoading }"
          >
            <span
              *ngIf="isLoading"
              class="spinner-border spinner-border-sm"
              aria-hidden="true"
            ></span>
            <span class="ms-2" role="status">Create account</span>
          </button>
        </form>

        <p class="signup-link">
          Already have an account? <a href="/login">Log in</a>
        </p>
      </div>
    </div>
  </div>
</div>
