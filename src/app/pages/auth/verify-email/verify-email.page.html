<div class="verify-email-page-container">
  <div class="verify-email-container">
    <div class="verify-email-content">
      <div class="left-panel">
        <h1 class="main-title">Verify Email</h1>
        <p class="subtitle">to get started</p>
      </div>

      <div class="right-panel">
        <h2 class="welcome-text">Welcome!</h2>
        <p class="verify-email-instruction">Verify your email</p>

        <form (ngSubmit)="verifyEmail()" #form="ngForm" autocomplete="off">
          <div class="form-group">
            <label for="code" class="visually-hidden">Code</label>
            <div class="input-with-icon">
              <i class="bi bi-code"></i>
              <input
                type="text"
                class="form-control"
                id="code"
                name="code"
                [(ngModel)]="code"
                placeholder="Code"
                required
              />
            </div>
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger mb-3">
            {{ errorMessage }}
          </div>

          <button
            class="btn btn-primary verify-email-btn"
            type="submit"
            [disabled]="!isFormValid()"
            [ngClass]="{ 'disabled': isLoading }"
          >
            <span
              *ngIf="isLoading"
              class="spinner-border spinner-border-sm"
              aria-hidden="true"
            ></span>
            <span class="ms-2" role="status">Verify email</span>
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
