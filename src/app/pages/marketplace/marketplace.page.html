<div class="container py-3 marketplace">
  <div class="d-flex flex-wrap align-items-center justify-content-between mb-3 gap-2">
    <div></div>
    <div class="btn-group" role="group">
      <button class="btn btn-sm btn-outline-primary" [class.active]="activeTab==='browse'" (click)="setTab('browse')">Browse</button>
      <button class="btn btn-sm btn-outline-primary" [class.active]="activeTab==='myBids'" (click)="setTab('myBids')">My Bids</button>
      <button class="btn btn-sm btn-outline-primary" [class.active]="activeTab==='myListings'" (click)="setTab('myListings')">My Listings</button>
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-body d-flex flex-wrap align-items-end gap-3">
      <div class="flex-grow-1">
        <label class="form-label small m-0">Search</label>
        <input type="text" class="form-control" [(ngModel)]="filters.query" placeholder="Search projects..." />
      </div>
      <div>
        <label class="form-label small m-0">Category</label>
        <select class="form-select" [(ngModel)]="filters.category">
          <option value="">All</option>
          <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
        </select>
      </div>
      <div class="form-check mt-4">
        <input class="form-check-input" type="checkbox" id="remoteOnly" [(ngModel)]="filters.remoteOnly" />
        <label for="remoteOnly" class="form-check-label">Remote only</label>
      </div>
      <div>
        <label class="form-label small m-0">Budget min</label>
        <input type="number" class="form-control" [(ngModel)]="filters.budgetMin" />
      </div>
      <div>
        <label class="form-label small m-0">Budget max</label>
        <input type="number" class="form-control" [(ngModel)]="filters.budgetMax" />
      </div>
      <div class="ms-auto">
        <button class="btn btn-sm btn-outline-secondary" (click)="postProject()">
          <i class="bi bi-plus-lg me-1"></i> Post a Project
        </button>
      </div>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-12 col-md-6 col-lg-4" *ngFor="let p of displayedProjects">
      <div class="card h-100">
        <div class="card-body d-flex flex-column">
          <div class="d-flex align-items-start justify-content-between mb-2">
            <div>
              <div class="fw-semibold">{{ p.title }}</div>
              <div class="text-muted small">{{ p.organization }} • {{ p.category }} • {{ p.remote ? 'Remote' : 'Onsite' }}</div>
            </div>
            <button class="btn btn-sm btn-outline-secondary" (click)="toggleSave(p.id)" [attr.aria-label]="p.saved ? 'Unsave' : 'Save'">
              <i class="bi" [class]="p.saved ? 'bi-bookmark-fill' : 'bi-bookmark' "></i>
            </button>
          </div>
          <div class="small mb-2">Budget: ${{ p.budget }} • Timeframe: {{ p.timeframeWeeks }} weeks</div>
          <div class="mb-2">
            <span class="badge bg-secondary me-1" *ngFor="let t of p.tags">{{ t }}</span>
          </div>
          <div class="text-truncate-3 mb-3">{{ p.description }}</div>
          <div class="d-flex justify-content-between mt-auto small text-muted">
            <span>{{ p.applicants }} applicants</span>
            <span>{{ p.posted }}</span>
          </div>
          <div class="d-flex gap-2 mt-3">
            <button class="btn btn-sm btn-outline-primary" (click)="viewProject(p.id)"><i class="bi bi-eye me-1"></i> View</button>
            <button class="btn btn-sm btn-primary" (click)="placeBid(p.id)"><i class="bi bi-cash-coin me-1"></i> Bid</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
