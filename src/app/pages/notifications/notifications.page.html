<div class="container py-3 d-flex flex-column gap-3">
  <div class="d-flex align-items-center justify-content-between">
    <ul class="nav nav-tabs">
      <li class="nav-item">
        <button class="nav-link" [class.active]="activeTab === 'all'" (click)="setTab('all')">
          All
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" [class.active]="activeTab === 'unread'" (click)="setTab('unread')">
          Unread
          <span class="badge bg-danger ms-2" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" [class.active]="activeTab === 'mentions'" (click)="setTab('mentions')">
          Mentions
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" [class.active]="activeTab === 'system'" (click)="setTab('system')">
          System
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" [class.active]="activeTab === 'invites'" (click)="setTab('invites')">
          Invites
        </button>
      </li>
    </ul>
    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-outline-secondary" (click)="markAllAsRead()" [disabled]="unreadCount === 0">
        Mark all as read
      </button>
    </div>
  </div>

  <div class="card" *ngIf="activeTab !== 'invites'">
    <div class="card-body p-0">
      <ul class="list-group list-group-flush">
        <li class="list-group-item d-flex align-items-start justify-content-between"
            *ngFor="let n of visibleNotifications">
          <div class="me-3">
            <div class="fw-semibold">{{ n.title }}</div>
            <div class="text-muted small">{{ n.message }}</div>
          </div>
          <div class="text-end">
            <div class="small text-muted">{{ n.timestamp }}</div>
            <button
              *ngIf="!n.read"
              class="btn btn-sm btn-outline-primary mt-2"
              (click)="markAsRead(n.id)"
            >Mark as read</button>
          </div>
        </li>
        <li class="list-group-item text-center text-muted" *ngIf="visibleNotifications.length === 0">
          No notifications
        </li>
      </ul>
    </div>
  </div>

  <div class="card" *ngIf="activeTab === 'invites'">
    <div class="card-body p-0">
      <ul class="list-group list-group-flush">
        <li class="list-group-item d-flex align-items-center justify-content-between" *ngFor="let i of invites">
          <div class="d-flex align-items-center gap-3">
            <span class="badge bg-primary text-uppercase">{{ i.type }}</span>
            <div>
              <div class="fw-semibold">{{ i.name }}</div>
              <div class="text-muted small">Invited by {{ i.inviter }} • {{ i.timestamp }}</div>
            </div>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-sm btn-outline-primary" (click)="acceptInvite(i.id)">Accept</button>
            <button class="btn btn-sm btn-outline-secondary" (click)="declineInvite(i.id)">Decline</button>
          </div>
        </li>
        <li class="list-group-item text-center text-muted" *ngIf="invites.length === 0">
          No pending invites
        </li>
      </ul>
    </div>
  </div>
</div>
