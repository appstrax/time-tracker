<div class="w-100" *ngIf="user">
  <h1 class="page-title">My Profile</h1>
  <section class="profile-section">
    <div class="d-flex align-items-center gap-4">
      <div class="profile-picture rounded-circle position-relative">
        <img
          [src]="user.profilePictureUrl"
          alt="Profile Picture"
          class="rounded-circle"
        />
        <i
          class="bi bi-camera-fill camera-icon"
          (click)="onUploadProfilePicture()"
        ></i>
      </div>

      <div>
        <div class="fw-bold user-name">{{user.name}} {{user.surname}}</div>
        <div>{{user.email}}</div>
      </div>
    </div>
  </section>

  <section class="profile-section">
    <div class="d-flex align-items-center justify-content-between">
      <h2 class="section-title">Personal Information</h2>
      <button class="btn btn-primary d-flex align-items-center gap-3">
        Edit
        <i class="bi bi-pencil"></i>
      </button>
    </div>
    <hr />
    <div class="d-grid">
      <div class="row mb-4">
        <div class="col-md-4">
          <div class="text-muted fw-light">First Name</div>
          <div class="fw-600">{{user.name}}</div>
        </div>
        <div class="col-md-4">
          <div class="text-muted fw-light">Last Name</div>
          <div class="fw-600">{{user.surname}}</div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4">
          <div class="text-muted fw-light">Email</div>
          <div class="fw-600">{{user.email}}</div>
        </div>
      </div>
    </div>
  </section>

  <section class="profile-section">
    <div class="d-flex align-items-center justify-content-between">
      <h2 class="section-title">Social Links</h2>
      <button class="btn btn-primary d-flex align-items-center gap-3">
        Edit
        <i class="bi bi-pencil"></i>
      </button>
    </div>
    <hr />

    <div class="d-grid">
      <div class="row mb-4">
        <div class="col-md-4">
          <app-social-link [url]="user.linkedinUrl"></app-social-link>
        </div>
        <div class="col-md-4">
          <app-social-link [url]="user.githubUrl"></app-social-link>
        </div>
        <div class="col-md-4">
          <app-social-link [url]="user.twitterUrl"></app-social-link>
        </div>
      </div>

      <div class="row mb-4">
        <div class="col-md-4">
          <app-social-link [url]="user.facebookUrl"></app-social-link>
        </div>
        <div class="col-md-4">
          <app-social-link [url]="user.instagramUrl"></app-social-link>
        </div>
        <div class="col-md-4">
          <app-social-link [url]="user.youtubeUrl"></app-social-link>
        </div>
      </div>

      <div class="row mb-4">
        <div class="col-md-4">
          <app-social-link [url]="user.tiktokUrl"></app-social-link>
        </div>
        <div class="col-md-4">
          <div class="text-muted fw-light">&nbsp;</div>
          <div></div>
        </div>
        <div class="col-md-4">
          <div class="text-muted fw-light">&nbsp;</div>
          <div></div>
        </div>
      </div>
    </div>
  </section>
</div>
