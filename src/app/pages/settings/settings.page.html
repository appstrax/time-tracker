<div class="container">
  <h2>Platform Settings</h2>

  <div class="card setting-card">
    <div class="card-body d-flex align-items-center justify-content-between">
      <div>
        <div class="setting-title">Auto-collapse side menu on inactivity</div>
        <div class="setting-desc">When enabled, the side navigation hides when the pointer leaves the edge.</div>
      </div>
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="autoCollapseSwitch" [checked]="(settings.autoCollapse$ | async) ?? false" (change)="toggleAutoCollapse($event)">
      </div>
    </div>
  </div>
</div>
