<app-split-pane
  storageKey="split.define"
  [initialLeftRatio]="0.7"
  [collapseBreakpointPx]="1024"
  [collapsedOnSmallScreens]="true"
>
  <ng-container left>
    <app-chat
      [suggestions]="ticketsSuggestions"
      placeholder="Describe your tickets..."
    ></app-chat>
  </ng-container>

  <ng-container right>
    <app-kanban-board storageKey="tickets.kanban.v1"></app-kanban-board>
  </ng-container>
</app-split-pane>
