<div class="filter-view-by-user">
  <div class="card">
    <div class="card-header">
      <h5 class="mb-0">Time Entries by User</h5>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-sm table-hover">
          <thead>
            <tr>
              <th>User</th>
              <th class="text-end">Total Hours</th>
              <th class="text-end">Approved</th>
              <th class="text-end">Pending</th>
              <th class="text-end">Entries</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let userData of getEntriesByUser()">
              <td>
                <div class="fw-semibold">{{ getUserDisplayName(userData.userId) }}</div>
                <div class="small text-muted">ID: {{ userData.userId }}</div>
              </td>
              <td class="text-end fw-semibold">{{ formatHours(userData.totalHours) }}</td>
              <td class="text-end">
                <span class="badge bg-success">{{ formatHours(userData.approvedHours) }}</span>
              </td>
              <td class="text-end">
                <span class="badge bg-warning">{{ formatHours(userData.pendingHours) }}</span>
              </td>
              <td class="text-end">{{ userData.entryCount }}</td>
            </tr>
            <tr *ngIf="!getEntriesByUser().length" class="text-center text-muted">
              <td colspan="5">No entries found</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
