<div class="filter-view-container">
  <!-- View Selection Section -->
  <div class="card mb-3">
    <div class="card-header d-flex align-items-center justify-content-between">
      <span class="fw-semibold">View Selection</span>
      <button
        type="button"
        class="btn btn-sm btn-link text-decoration-none p-0"
        (click)="toggleViewSelection()"
        [attr.aria-expanded]="!isViewSelectionCollapsed"
        aria-controls="viewSelectionCollapse"
      >
        <i
          [class]="
            'bi ' +
            (isViewSelectionCollapsed ? 'bi-chevron-down' : 'bi-chevron-up')
          "
        ></i>
      </button>
    </div>
    <div
      id="viewSelectionCollapse"
      [class.collapse]="true"
      [class.show]="!isViewSelectionCollapsed"
    >
      <div class="card-body">
        <div class="d-flex flex-wrap gap-2">
          <button
            *ngFor="let viewType of viewTypes"
            type="button"
            class="view-type-option btn"
            [class.active]="currentViewType === viewType.value"
            (click)="onViewTypeChange(viewType.value)"
          >
            <div class="icon-wrapper">
              <i [class]="'bi ' + viewType.icon"></i>
            </div>
            <div class="text-start">
              <div class="view-label">{{ viewType.label }}</div>
              <div class="view-description">{{ viewType.description }}</div>
            </div>
          </button>
        </div>
      </div>
    </div>

    <div class="d-flex flex-wrap gap-2">
      <div>
        <label class="form-label small fw-semibold">Date Range</label>
        <select
          class="form-select form-select-sm"
          [(ngModel)]="filters.dateRange"
          (change)="onDateRangeChange()"
        >
          <option value="week">This Week</option>
          <option value="month">This Month</option>
          <option value="year">This Year</option>
          <option value="all">All</option>
          <option value="custom">Custom</option>
        </select>
      </div>

        <div>
          <label class="form-label small fw-semibold">Status</label>
          <select
            class="form-select form-select-sm"
            [(ngModel)]="filters.status"
            (change)="onStatusChange()"
          >
            <option value="all">All</option>
            <option value="approved">Approved</option>
            <option value="pending">Pending</option>
          </select>
        </div>
        <div>
          <label class="form-label small fw-semibold">Category</label>
          <select
            class="form-select form-select-sm"
            [(ngModel)]="filters.category"
            (change)="onCategoryChange()"
          >
            <option [value]="null">All Categories</option>
            <option
              *ngFor="let category of availableCategories"
              [value]="category"
            >
              {{ category }}
            </option>
          </select>
        </div>
        <div>
          <label class="form-label small fw-semibold">User</label>
          <select
            class="form-select form-select-sm"
            [(ngModel)]="filters.userId"
            (change)="onUserChange()"
          >
            <option [value]="null">All Users</option>
            <option *ngFor="let user of availableUsers" [value]="user.id">
              {{ user.name }}
            </option>
          </select>
        </div>
    </div>
  </div>

  <!-- View Content -->
  <div class="view-content">
    @if(currentViewType === 'summary') {
    <app-filter-view-summary
      [entries]="getEntriesForView()"
    ></app-filter-view-summary>
    } @if(currentViewType === 'details') {
    <app-filter-view-details
      [entries]="getEntriesForView()"
    ></app-filter-view-details>
    } @if(currentViewType === 'timeline') {
    <app-filter-view-timeline
      [entries]="getEntriesForView()"
    ></app-filter-view-timeline>
    } @if(currentViewType === 'unapproved') {
    <app-unapproved-entries
      [timeSheetEntries]="timeSheetEntries"
      [canApprove]="canApprove"
    ></app-unapproved-entries>
    }
  </div>
</div>
