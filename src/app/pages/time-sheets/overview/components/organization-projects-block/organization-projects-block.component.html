@if (organizationId && isExpanded) {
<div class="organization-projects-block">
  <div class="projects-container">
    <app-projects-block
      [project]="null"
      [isAllProjects]="true"
      [isSelected]="isProjectSelected(null)"
      (projectSelected)="onProjectSelected($event)"
    ></app-projects-block>
    @for (project of projects; track project.id) {
    <app-projects-block
      [project]="project"
      [isSelected]="isProjectSelected(project)"
      (projectSelected)="onProjectSelected($event)"
    ></app-projects-block>
    } @if (isLoading) {
    <div class="text-center py-2 text-muted small">
      <div class="spinner-border spinner-border-sm" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
    }
    <div
      *ngIf="!isLoading && !projects.length"
      class="text-center py-2 text-muted small"
    >
      No projects found
    </div>
  </div>
</div>
}
