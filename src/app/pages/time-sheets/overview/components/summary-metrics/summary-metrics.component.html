<div class="row g-3 mb-3">
  <div class="col-md-3 col-sm-6">
    <div class="card h-100">
      <div class="card-body">
        <div class="d-flex align-items-center justify-content-between">
          <div>
            <div class="text-muted small mb-1">Organizations</div>
            <div class="h4 mb-0">{{ metrics.organizationsCount }}</div>
          </div>
          <i class="bi bi-building fs-1 text-success opacity-50"></i>
        </div>
      </div>
    </div>
  </div>
  <div class="col-md-3 col-sm-6">
    <div class="card h-100">
      <div class="card-body">
        <div class="d-flex align-items-center justify-content-between">
          <div>
            <div class="text-muted small mb-1">Projects</div>
            <div class="h4 mb-0">{{ metrics.projectsCount }}</div>
          </div>
          <i class="bi bi-folder fs-1 text-success opacity-50"></i>
        </div>
      </div>
    </div>
  </div>
  <div class="col-md-3 col-sm-6">
    <div class="card h-100">
      <div class="card-body">
        <div class="d-flex align-items-center justify-content-between">
          <div>
            <div class="text-muted small mb-1">Total Hours</div>
            <div class="h4 mb-0">{{ metrics.totalHours | number:'1.1-1' }}h</div>
          </div>
          <i class="bi bi-clock-history fs-1 text-primary opacity-50"></i>
        </div>
      </div>
    </div>
  </div>
  <div class="col-md-3 col-sm-6">
    <div class="card h-100">
      <div class="card-body">
        <div class="d-flex align-items-center justify-content-between">
          <div>
            <div class="text-muted small mb-1">Pending</div>
            <div class="h4 mb-0">{{ metrics.pendingCount }}</div>
          </div>
          <i class="bi bi-hourglass-split fs-1 text-warning opacity-50"></i>
        </div>
      </div>
    </div>
  </div>

</div>
