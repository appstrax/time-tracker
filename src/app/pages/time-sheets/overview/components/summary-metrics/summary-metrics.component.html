<div class="row g-3 mb-3">
  @for (card of metricCardConfigs; track card.label) {
  <div class="col-md-3 col-sm-6">
    <app-metric-card
      [label]="card.label"
      [value]="formatCardValue(card)"
      [valueSuffix]="card.valueSuffix || ''"
      [iconClass]="card.iconClass + ' opacity-50'"
    ></app-metric-card>
  </div>
  }
</div>
