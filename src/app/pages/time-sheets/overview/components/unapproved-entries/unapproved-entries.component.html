<div class="card h-100">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span class="fw-semibold">Unapproved Entries</span>
    <span class="badge bg-warning">{{ groupedEntries.length }} groups</span>
  </div>
  <div class="card-body p-0">
    <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
      <table class="table table-hover mb-0">
        <thead class="table-light sticky-top">
          <tr>
            <th>Date</th>
            <th>User</th>
            <th>Hours</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="isLoading">
            <td colspan="3" class="text-center py-4">
              <div class="spinner-border spinner-border-sm" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </td>
          </tr>
          <tr *ngIf="!isLoading && groupedEntries.length === 0">
            <td colspan="3" class="text-center py-4 text-muted">
              No unapproved entries
            </td>
          </tr>
          <tr
            *ngFor="let group of groupedEntries"
            class="table-warning clickable-row"
            (click)="onEntryClick(group)"
            [title]="'Click to view and approve ' + group.entries.length + ' entries'"
          >
            <td>{{ formatDate(group.date) }}</td>
            <td>
              <small>{{ getUserName(group.userId) }}</small>
            </td>
            <td>{{ formatHours(group.totalHours) }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
