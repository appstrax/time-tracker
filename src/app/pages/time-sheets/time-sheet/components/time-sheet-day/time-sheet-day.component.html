<div class="time-sheet-day-section">
  <div class="d-flex align-items-center">
    <div class="time-sheet-day-date">
      <div class="time-sheet-day-title">{{ date() | date: "EEEE" }}</div>
      <div class="day-date">{{ date() | date: "d MMM yyyy" }}</div>
    </div>

    <div class="w-100">
      <app-time-sheet-number-line
        [colorIndex]="date().getDay()"
        (onEntryClick)="openTimeSheetEntryModal($event)"
        (onCreateEntry)="openTimeSheetEntryModal($event)"
        [projects]="projects()"
        [entries]="sortedEntries()"
        [disabled]="approved()"
      />
    </div>
  </div>
</div>
