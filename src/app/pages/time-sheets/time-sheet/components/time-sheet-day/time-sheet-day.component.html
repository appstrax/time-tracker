<div class="col-day">
  <div class="day-name">{{ date() | date: "EEE, MMM d" }}</div>
</div>

<div class="col-logged">
  @if (loggedHours()) {
    <span class="logged-value">{{ formatLoggedTotal() }}</span>
  } @else {
    <span class="logged-empty">—</span>
  }
</div>

<div class="col-ruler">
  <app-time-sheet-number-line
    [colorIndex]="date().getDay()"
    (onEntryClick)="openTimeSheetEntryModal($event)"
    (onCreateEntry)="openTimeSheetEntryModal($event)"
    [projects]="projects()"
    [entries]="sortedEntries()"
    [disabled]="approved()"
  />
</div>
