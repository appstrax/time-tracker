<div class="time-sheet-day-section">
  <div class="d-flex align-items-center">
    <div class="col-2">
                <div class="time-sheet-day-title">{{ date | date:'EEEE' }}</div>
                <div class="day-date"> {{ date | date:'d MMM yyyy' }}</div>
    </div>
    <div class="col-1">
        <span class="bi bi-plus-circle me-3" style="font-size: 20px;"></span></div>
    <div class="col-9">
        <div class="align-items-center">

            <app-time-sheet-number-line [entries]="entries" [categoryColors]="categoryColors"></app-time-sheet-number-line>
        </div>
    </div>
  </div>
</div>
