<div class="time-sheet">
  <div class="time-sheet-card" [class.time-sheet-card-disabled]="disabled()">
    <div class="time-sheet-card-header">
      <div class="time-sheet-card-total">{{ totalLoggedLabel() }}</div>
    </div>

    <div class="number-line" (mouseleave)="onNumberLineLeave()">
      @for (i of numberLineArray(); track i) {
        <div
          class="number-line-item"
          [class.d-none]="i == 0"
          [class.number-line-item-disabled]="disabled()"
          [class.number-line-item-logged]="isTickLogged(i)"
          [class.number-line-item-hovered]="isTickHovered(i)"
          [style.background-color]="getColor(i)"
          [attr.tabindex]="isTickInteractive(i) ? 0 : -1"
          (mouseenter)="onNumberLineHover(i, $event)"
          (focus)="onNumberLineHover(i, $event)"
          (click)="onNumberLineClick(i)"
        >
          @if (getNumberLineValue(i)) {
            <span class="tick-label">{{ getNumberLineValue(i) }}</span>
          }
          <span
            class="tick-mark"
            [ngStyle]="{
              height: getNumberLineHeight(i),
            }"
          >
          </span>
        </div>
      }
    </div>
  </div>
</div>
