<section class="time-sheet-page container py-4">
  <header class="page-header d-flex justify-content-between align-items-center">
    <div>
      <p class="eyebrow">Time tracking</p>
      <h1>Weekly time sheet</h1>
      <p class="subtitle">
        Capture and review your hours for each day in the selected week.
      </p>
    </div>
    <div class="page-header-tools">
      @if (!loading() && projects().length) {
        <div class="page-header-tool" aria-label="Current project">
          <span class="page-header-tool-label">Working on</span>
          <app-project-dropdown
            class="page-header-tool-control working-on-dropdown"
            [selectedProject]="workingOnProject()"
            [allowNull]="true"
            [compact]="true"
            (projectSelected)="onWorkingOnProjectSelected($event)"
          />
        </div>
      }
      <div class="page-header-tool" aria-label="Selected week">
        <span class="page-header-tool-label">Week</span>
        <app-time-sheet-date-selector
          class="page-header-tool-control"
          (weekChange)="onWeekChange($event)"
        />
      </div>
    </div>
  </header>
  <section class="time-sheet-section">
    @if (loading()) {
    <div
      class="time-sheet-spinner d-flex justify-content-center align-items-center"
    >
      <span class="spinner-border" aria-hidden="true"></span>
    </div>
    } @else { @for (day of weekDays(); track day.getTime()) {
    <div class="time-sheet-day-border">
      <app-time-sheet-day
        [date]="day"
        [projects]="projects()"
        [entries]="entriesByDate().get(day.toDateString()) ?? []"
        [categories]="categories()"
        (save)="onTimeSheetEntrySaved()"
      />
    </div>
    } }
  </section>
</section>
