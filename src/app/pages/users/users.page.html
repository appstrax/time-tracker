<div class="container">
  <section class="users-section">
    <div class="d-flex align-items-center justify-content-between">
      <h2 class="section-title">Project Users</h2>
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-secondary">Invite to Organization</button>
        <button class="btn btn-primary">Invite to Project</button>
      </div>
    </div>
    <hr />

    <div class="row g-3">
      <div class="col-md-4">
        <div class="filter-card p-3 rounded-4 shadow-sm bg-white">
          <div class="mb-2 fw-500">Filters</div>
          <div class="mb-2">
            <label class="form-label">Search</label>
            <input type="text" class="form-control" placeholder="Name or email" />
          </div>
          <div class="mb-2">
            <label class="form-label">Role</label>
            <select class="form-select">
              <option value="">All</option>
              <option>Owner</option>
              <option>Admin</option>
              <option>Maintainer</option>
              <option>Developer</option>
              <option>Viewer</option>
            </select>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary w-50">Reset</button>
            <button class="btn btn-primary w-50">Apply</button>
          </div>
        </div>
      </div>

      <div class="col-md-8">
        <div class="table-card p-3 rounded-4 shadow-sm bg-white">
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead>
                <tr>
                  <th scope="col">User</th>
                  <th scope="col">Email</th>
                  <th scope="col">Role</th>
                  <th scope="col" class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>
                    <div class="d-flex align-items-center gap-3">
                      <img class="avatar" src="/favicon.ico" alt="avatar" />
                      <div>
                        <div class="fw-500">Jane Doe</div>
                        <div class="text-muted">&#64;janedoe</div>
                      </div>
                    </div>
                  </td>
                  <td>jane&#64;example.com</td>
                  <td>
                    <select class="form-select form-select-sm w-auto">
                      <option selected>Developer</option>
                      <option>Maintainer</option>
                      <option>Admin</option>
                      <option>Owner</option>
                    </select>
                  </td>
                  <td class="text-end">
                    <button class="btn btn-sm btn-outline-danger">Remove</button>
                  </td>
                </tr>
                <tr>
                  <td>
                    <div class="d-flex align-items-center gap-3">
                      <img class="avatar" src="/favicon.ico" alt="avatar" />
                      <div>
                        <div class="fw-500">John Smith</div>
                        <div class="text-muted">&#64;johnsmith</div>
                      </div>
                    </div>
                  </td>
                  <td>john&#64;example.com</td>
                  <td>
                    <select class="form-select form-select-sm w-auto">
                      <option>Developer</option>
                      <option selected>Maintainer</option>
                      <option>Admin</option>
                      <option>Owner</option>
                    </select>
                  </td>
                  <td class="text-end">
                    <button class="btn btn-sm btn-outline-danger">Remove</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="users-section">
    <div class="d-flex align-items-center justify-content-between">
      <h2 class="section-title">Pending Invites</h2>
      <button class="btn btn-outline-secondary">Resend All</button>
    </div>
    <hr />
    <div class="table-card p-3 rounded-4 shadow-sm bg-white">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead>
            <tr>
              <th scope="col">Email</th>
              <th scope="col">Invited By</th>
              <th scope="col">Role</th>
              <th scope="col" class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>alex&#64;example.com</td>
              <td>Jane Doe</td>
              <td>Viewer</td>
              <td class="text-end">
                <div class="btn-group">
                  <button class="btn btn-sm btn-outline-secondary">Resend</button>
                  <button class="btn btn-sm btn-outline-danger">Revoke</button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
</div>
